[package]
name = "agmanage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "compat-1-2", "accessibility"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
chrono = "=0.4.45"
uuid = { version = "=1.23.4", features = ["v4"] }
png = "=0.18.1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
strip = "debuginfo"

